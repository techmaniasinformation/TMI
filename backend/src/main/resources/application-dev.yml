spring:
  datasource:
    url: ${RDB_URL}
    username: ${RDB_USER}
    password: ${RDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver




  jpa:
    hibernate:
      ddl-auto: update  # 또는 create, none, validate 등
    show-sql: true
    properties:

      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

