spring:
  datasource:
    url: ${RDB_URL}
    username: ${RDB_USER}
    password: ${RDB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 또는 create, none, validate 등
    show-sql: true
    properties:

      hibernate:
        default_batch_fetch_size: 100 # n+1 문제 최적화 -> 1 + 1 문제로 해결 (in 절의 개수 설정)
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect